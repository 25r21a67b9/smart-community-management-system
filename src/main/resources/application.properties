# ============================================================================
# SMART COMMUNITY MANAGEMENT SYSTEM - SPRING BOOT CONFIGURATION
# ============================================================================

spring.application.name=smart-community-management
server.port=8080

# MySQL Database Connection Configuration
# Override using environment variables DB_URL, DB_USERNAME, DB_PASSWORD in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Static Resources (HTML5, CSS3, Bootstrap 5.3, Vanilla JS)
spring.web.resources.static-locations=classpath:/static/

# Jackson Date Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
