<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Community Management System</title>
    <meta
      name="description"
      content="A comprehensive residential apartment and community management platform with resident directory, smart PriorityQueue complaint ranking, worker assignment, visitor log, maintenance billing, facility booking, and analytics."
    />
    <meta property="og:title" content="Smart Community Management System" />
    <meta
      property="og:description"
      content="A comprehensive residential apartment and community management platform with resident directory, smart PriorityQueue complaint ranking, worker assignment, visitor log, maintenance billing, facility booking, and analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans (Display), Public Sans (Body), JetBrains Mono (Tabular Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons 1.11.3 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom Smart Community Stylesheet -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Main Application Root rendered by Vanilla JS (public/js/app.js) -->
    <div id="app"></div>

    <!-- Toast Notification Container -->
    <div
      id="toast-container"
      class="toast-container position-fixed bottom-0 end-0 p-3"
      style="z-index: 1090"
    ></div>

    <!-- Reusable Modal Container -->
    <div
      class="modal fade"
      id="scModal"
      tabindex="-1"
      aria-labelledby="scModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg" id="scModalDialog">
        <div class="modal-content border-0 shadow">
          <div class="modal-header border-bottom px-4 py-3">
            <h5 class="modal-title fw-bold" id="scModalTitle">Modal Title</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body px-4 py-3" id="scModalBody"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js 4.4.2 for Dashboard & Reports Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <!-- Vanilla JavaScript Application Controller -->
    <script src="/js/app.js"></script>
  </body>
</html>
